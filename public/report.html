<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#dc0d23" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Report-Generator · Reineke Technik</title>
    <link rel="icon" type="image/png" href="/assets/favicon.png" />
    <style>
      :root {
        --rt-red: #dc0d23; --rt-red-dark: #8a060e; --rt-accent: var(--rt-red); --rt-gray: #5a5a5a;
        --rt-border: #e6e7e6; --rt-bg: #f7f7f8; --g-green: #1e8e3e;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; color: #111; background: var(--rt-bg);
        font-family: "Frutiger", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      }
      .rg-wrap { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; }
      .rg-card {
        background: #fff; border: 1px solid var(--rt-border); border-top: 4px solid var(--rt-red);
        border-radius: 10px; max-width: 480px; width: 100%; padding: 28px 28px 24px;
        box-shadow: 0 6px 30px rgba(0, 0, 0, 0.06);
      }
      .rg-head { display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--rt-border); padding-bottom: 12px; margin-bottom: 18px; }
      .rg-sharp { height: 18px; }
      .rg-sep { color: var(--rt-border); }
      .rg-kicker { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--rt-gray); }
      .rg-bs { color: var(--rt-accent); font-weight: 800; margin-right: 0.3em; }
      h1 { font-size: 20px; margin: 0 0 4px; }
      .rg-sub { color: var(--rt-gray); font-size: 13px; margin: 0 0 18px; }
      .rg-form { display: flex; flex-direction: column; gap: 10px; }
      .rg-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: var(--rt-gray); }
      .rg-input { font-size: 15px; padding: 11px 13px; border: 1px solid var(--rt-border); border-radius: 7px; width: 100%; }
      .rg-input:focus { outline: none; border-color: var(--rt-red); box-shadow: 0 0 0 3px rgba(220, 13, 35, 0.12); }
      .rg-btn { background: var(--rt-red); color: #fff; border: none; border-radius: 7px; padding: 12px 16px; font-size: 15px; font-weight: 700; cursor: pointer; text-align: center; text-decoration: none; display: inline-block; }
      .rg-btn:hover { background: var(--rt-red-dark); }
      .rg-btn:disabled { opacity: 0.6; cursor: default; }
      .rg-err { color: var(--rt-red); font-size: 13px; margin: 8px 0 0; }
      .rg-progress { margin-top: 18px; }
      .rg-bar { height: 10px; background: var(--rt-bg); border: 1px solid var(--rt-border); border-radius: 20px; overflow: hidden; }
      .rg-bar-fill { height: 100%; width: 0; background: linear-gradient(90deg, var(--rt-red), var(--rt-red-dark)); border-radius: 20px; transition: width 0.35s ease; }
      .rg-status { font-size: 13px; color: var(--rt-gray); margin: 10px 0 0; }
      .rg-done { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
      .rg-ok { color: var(--g-green); font-weight: 700; margin: 0; }
      .rg-btn-dl { background: var(--g-green); }
      .rg-btn-dl:hover { background: #16702f; }
      .rg-link { background: none; border: none; color: var(--rt-red); font-size: 13px; cursor: pointer; text-decoration: underline; padding: 0; align-self: flex-start; }
      .rg-foot { margin-top: 16px; font-size: 13px; }
      .rg-foot a { color: var(--rt-gray); }
      .rg-row { display: flex; gap: 8px; align-items: stretch; }
      .rg-row .rg-input { flex: 1; }
      .rg-select { background: #fff; }
      .rg-icon-btn { flex: 0 0 auto; width: 44px; border: 1px solid var(--rt-border); background: #fff; color: var(--rt-red); font-size: 22px; line-height: 1; border-radius: 7px; cursor: pointer; }
      .rg-icon-btn:hover { border-color: var(--rt-red); }
      .rg-hint { font-size: 12px; margin: -2px 0 0; }
      .rg-addrep { margin-top: 14px; border: 1px solid var(--rt-border); border-radius: 8px; padding: 14px; background: var(--rt-bg); }
      .rg-addrep h2 { font-size: 14px; margin: 0 0 10px; }
      .rg-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 10px; }
      .rg-grid label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; color: var(--rt-gray); display: flex; flex-direction: column; gap: 4px; }
      .rg-grid label.rg-wide { grid-column: 1 / -1; }
      .rg-grid input { font-size: 14px; padding: 8px 10px; border: 1px solid var(--rt-border); border-radius: 6px; font-weight: 400; text-transform: none; letter-spacing: 0; color: #111; }
      .rg-grid input:focus { outline: none; border-color: var(--rt-red); }
      .rg-addrep-actions { display: flex; gap: 12px; align-items: center; margin-top: 12px; }
      .rg-addrep-actions .rg-btn { padding: 9px 16px; font-size: 14px; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <main class="rg-wrap">
      <div class="rg-card">
        <div class="rg-head">
          <img class="rg-sharp" src="/assets/sharp-logo.png" alt="Sharp" />
          <span class="rg-sep">·</span>
          <span class="rg-kicker"><span class="rg-bs">\</span>Report-Generator</span>
        </div>

        <!-- LOGIN -->
        <section id="login">
          <h1>Anmeldung</h1>
          <p class="rg-sub">Dieser Bereich ist passwortgeschützt.</p>
          <form id="loginForm" class="rg-form" autocomplete="off">
            <label class="rg-label" for="pw">Passwort</label>
            <input id="pw" type="password" class="rg-input" placeholder="Passwort" required autocomplete="current-password" />
            <button type="submit" id="loginBtn" class="rg-btn">Anmelden</button>
            <p id="loginErr" class="rg-err" hidden></p>
          </form>
        </section>

        <!-- GENERATOR -->
        <section id="gen" hidden>
          <h1>Sicherheits-Report erstellen</h1>
          <p class="rg-sub">Domain eingeben — DMARC, DNSSEC und Website-Sicherheit werden geprüft und als gebrandetes PDF erstellt.</p>
          <form id="genForm" class="rg-form">
            <label class="rg-label" for="rep">Vertriebsmitarbeiter</label>
            <div class="rg-row">
              <select id="rep" class="rg-input rg-select" aria-label="Vertriebsmitarbeiter"></select>
              <button type="button" id="addRepBtn" class="rg-icon-btn" title="Vertriebsmitarbeiter hinzufügen" aria-label="Vertriebsmitarbeiter hinzufügen">+</button>
            </div>
            <p id="repRemoveWrap" class="rg-hint" hidden><button type="button" id="repRemove" class="rg-link">Diesen (selbst angelegten) Eintrag entfernen</button></p>

            <label class="rg-label" for="domain">Domain</label>
            <input id="domain" type="text" class="rg-input" placeholder="z. B. cemex.de" required autocapitalize="off" autocorrect="off" spellcheck="false" />
            <button type="submit" id="genBtn" class="rg-btn">Report erstellen</button>
          </form>

          <!-- Vertriebsmitarbeiter hinzufügen -->
          <div id="addRep" class="rg-addrep" hidden>
            <h2>Vertriebsmitarbeiter hinzufügen</h2>
            <div class="rg-grid">
              <label class="rg-wide">Name<input id="ar-name" type="text" autocomplete="off" /></label>
              <label>Funktion<input id="ar-role" type="text" placeholder="z. B. Sales" autocomplete="off" /></label>
              <label>Firma<input id="ar-org" type="text" placeholder="Sharp Business Systems Deutschland GmbH" autocomplete="off" /></label>
              <label class="rg-wide">E-Mail<input id="ar-mail" type="email" autocomplete="off" /></label>
              <label>Telefon<input id="ar-tel" type="text" autocomplete="off" /></label>
              <label>Mobil<input id="ar-mobile" type="text" autocomplete="off" /></label>
              <label class="rg-wide">Adresse<input id="ar-addr" type="text" placeholder="Straße Nr., PLZ Ort" autocomplete="off" /></label>
              <label>Web<input id="ar-web" type="text" placeholder="www.sharp.de" autocomplete="off" /></label>
            </div>
            <p id="ar-err" class="rg-err" hidden></p>
            <div class="rg-addrep-actions">
              <button type="button" id="ar-save" class="rg-btn">Speichern</button>
              <button type="button" id="ar-cancel" class="rg-link">Abbrechen</button>
            </div>
          </div>

          <div id="progress" class="rg-progress" hidden>
            <div class="rg-bar"><div id="barFill" class="rg-bar-fill"></div></div>
            <p id="statusText" class="rg-status">…</p>
          </div>

          <div id="done" class="rg-done" hidden>
            <p class="rg-ok">✓ Report erstellt.</p>
            <a id="dl" class="rg-btn rg-btn-dl" download>PDF herunterladen</a>
            <button type="button" id="again" class="rg-link">Weiteren Report erstellen</button>
          </div>

          <p id="genErr" class="rg-err" hidden></p>
        </section>
      </div>
      <p class="rg-foot"><a href="/">← Zur Startseite</a></p>
    </main>
    <script src="/report.js" defer></script>
  </body>
</html>
