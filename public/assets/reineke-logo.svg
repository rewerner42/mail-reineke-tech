<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 60" role="img" aria-label="Reineke Technik">
  <defs>
    <linearGradient id="rt-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#003876"/>
      <stop offset="100%" stop-color="#00264f"/>
    </linearGradient>
  </defs>
  <!-- Mark: stylized "RT" with red dot -->
  <g>
    <rect x="2" y="6" width="48" height="48" rx="6" fill="url(#rt-accent)"/>
    <text x="26" y="42" text-anchor="middle"
      font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"
      font-size="26" font-weight="800" fill="#ffffff" letter-spacing="-0.5">RT</text>
    <circle cx="44" cy="14" r="4" fill="#e30613"/>
  </g>
  <!-- Wordmark -->
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
    <text x="62" y="32" font-size="20" font-weight="800" fill="#003876" letter-spacing="-0.2">REINEKE</text>
    <text x="62" y="50" font-size="13" font-weight="500" fill="#475569" letter-spacing="3">TECHNIK</text>
  </g>
</svg>
