name = "mail-reineke-tech"
main = "src/index.ts"
compatibility_date = "2025-01-15"
compatibility_flags = ["nodejs_compat"]

# Browser Rendering — headless Chrome for the server-side PDF export.
# (Top-level key: must precede any [table] header.)
browser = { binding = "BROWSER" }

# Static assets (frontend served from /public)
# run_worker_first: route asset requests through the Worker too, so the security
# headers (middleware in src/index.ts) are attached to the HTML/asset responses.
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

# ─── Sharp partner channel ───────────────────────────────────────────────────
# Deploy with:  wrangler deploy --env sharp
# (Worker name unchanged — this is the former [env.production] deployment.)
[env.sharp]
name = "mail-reineke-tech"
routes = [
  { pattern = "sharp.reineke.tech", custom_domain = true }
]
browser = { binding = "BROWSER" }

[env.sharp.vars]
BRAND = "sharp"

[env.sharp.assets]
directory = "./public"
binding = "ASSETS"
# Echte 404 wie bei Reineke, seit 01.11.2026 (Werners Entscheidung). Vorher
# bekam jede unbekannte URL Status 200 mit der Startseite, auch /.DS_Store.
# Die drei Pruef-Ansichten haben eigene Routen (src/index.ts).
not_found_handling = "404-page"
run_worker_first = true

# ─── Reineke Technik (pentest funnel) ────────────────────────────────────────
# Deploy with:  wrangler deploy --env reineke
[env.reineke]
name = "scan-reineke-tech"
# BEIDE Adressen. scan.reineke.tech bleibt dauerhaft: sie steht in
# Druckstuecken und auf jedem bisher ausgelieferten PDF. Keine Weiterleitung,
# zwei gleichwertige Eingaenge.
# Beide muessen hier stehen, nicht nur im Dashboard -- wrangler gleicht die
# Routen beim Deploy ab und wuerde eine hier fehlende Custom Domain entfernen.
routes = [
  { pattern = "scan.reineke-technik.de", custom_domain = true },
  { pattern = "scan.reineke.tech", custom_domain = true }
]
browser = { binding = "BROWSER" }

[env.reineke.vars]
BRAND = "reineke"

[env.reineke.assets]
directory = "./public"
binding = "ASSETS"
# Echte 404 statt Startseite: vorher lieferte JEDE unbekannte URL Status 200 mit
# der Startseite — Google sah dadurch beliebig viele Duplikate. Die drei
# SPA-Ansichten haben eigene Routen (src/index.ts). Sharp hat dieselbe
# Einstellung seit 01.11.2026.
not_found_handling = "404-page"
run_worker_first = true

# Observability
[observability]
enabled = true
