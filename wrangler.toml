name = "mail-reineke-tech"
main = "src/index.ts"
compatibility_date = "2025-01-15"
compatibility_flags = ["nodejs_compat"]

# Browser Rendering — headless Chrome for the server-side PDF export.
# (Top-level key: must precede any [table] header.)
browser = { binding = "BROWSER" }

# Static assets (frontend served from /public)
# run_worker_first: route asset requests through the Worker too, so the security
# headers (middleware in src/index.ts) are attached to the HTML/asset responses.
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

# Production environment with custom domain
[env.production]
name = "mail-reineke-tech"
routes = [
  { pattern = "sharp.reineke.tech", custom_domain = true },
  { pattern = "mail.reineke.tech", custom_domain = true },
  { pattern = "scan.reineke.tech", custom_domain = true }
]
browser = { binding = "BROWSER" }

[env.production.assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

# ─── WS IT-TECHNOLOGY white-label ────────────────────────────────────────────
# Separate Worker + custom domain. Deploy independently with:
#   wrangler deploy --env wsit
# This NEVER touches the sharp/mail/scan production Worker (that is --env production).
[env.wsit]
name = "wsit-reineke-tech"
routes = [
  { pattern = "wsit.reineke.tech", custom_domain = true }
]
browser = { binding = "BROWSER" }

[env.wsit.assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

# Observability
[observability]
enabled = true
