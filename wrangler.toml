name = "mail-reineke-tech"
main = "src/index.ts"
compatibility_date = "2025-01-15"
compatibility_flags = ["nodejs_compat"]

# Browser Rendering — headless Chrome for the server-side PDF export.
# (Top-level key: must precede any [table] header.)
browser = { binding = "BROWSER" }

# Static assets (frontend served from /public)
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"

# Production environment with custom domain
[env.production]
name = "mail-reineke-tech"
routes = [
  { pattern = "sharp.reineke.tech", custom_domain = true },
  { pattern = "mail.reineke.tech", custom_domain = true }
]
browser = { binding = "BROWSER" }

[env.production.assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"

# Observability
[observability]
enabled = true
